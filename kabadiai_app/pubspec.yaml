name: kabadiai_app
description: KabadiAI — AI-powered waste management platform (Samsung Innovate Hackathon)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.1.0
  cloud_firestore: ^5.1.0

  # Camera (Linux desktop: camera preview works via camera package)
  camera: ^0.11.0
  image: ^4.1.7

  # Maps — flutter_map works on Linux/Web/Android/iOS; uses OpenStreetMap tiles
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # GPS
  geolocator: ^12.0.0

  # HTTP & state
  http: ^1.2.1
  provider: ^6.1.2
  flutter_animate: ^4.5.0

  # UI
  fl_chart: ^0.67.0
  shimmer: ^3.0.0
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/model/
